<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1930년대 미국식 8칸 특급 열차 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #080c12;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      color: #e6dfcf;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Subtle Crosshair */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      pointer-events: none;
      z-index: 5;
    }

    /* Sitting Toast Notification */
    #sit-prompt {
      display: none;
      position: absolute;
      bottom: 75px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(14, 20, 28, 0.9);
      border: 1px solid #dfb142;
      color: #dfb142;
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      pointer-events: none;
      z-index: 15;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
  </style>

  <script>
    window.onerror = function(msg, url, line, col, err) {
      var d = document.createElement('div');
      d.id = 'debug-error';
      d.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:red;color:white;z-index:999999;font-size:20px;padding:20px;';
      d.textContent = 'ERROR: ' + msg + ' at ' + url + ':' + line + ':' + col;
      document.body.appendChild(d);
    };
  </script>

  <!-- Libraries -->
  <script src="libs/three.min.js"></script>
  <script src="libs/PointerLockControls.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="crosshair"></div>
  <div id="sit-prompt">[Space] 키를 눌러 일어나기</div>

  <!-- Character Inspection Nameplate -->
  <div id="char-nameplate" style="display:none; position:absolute; bottom:35px; left:50%; transform:translateX(-50%); background:rgba(14,20,28,0.88); border:1px solid #dfb142; color:#dfb142; padding:6px 18px; border-radius:6px; font-weight:600; font-size:14px; pointer-events:none; z-index:15; letter-spacing:0.5px; box-shadow:0 4px 15px rgba(0,0,0,0.6);"></div>

  <!-- Source Scripts -->
  <script src="src/textures.js?v=26"></script>
  <script src="src/audio.js?v=26"></script>
  <script src="src/collision.js?v=26"></script>
  <script src="src/environment.js?v=26"></script>
  <script src="src/train/doorManager.js?v=26"></script>
  <script src="src/train/car1_locomotive.js?v=26"></script>
  <script src="src/train/car2_baggage.js?v=26"></script>
  <script src="src/train/car3_coach.js?v=26"></script>
  <script src="src/train/car4_sleeper1.js?v=26"></script>
  <script src="src/train/car5_sleeper2.js?v=26"></script>
  <script src="src/train/car6_diner.js?v=26"></script>
  <script src="src/train/car7_lounge.js?v=26"></script>
  <script src="src/train/car8_observation.js?v=26"></script>
  <script src="src/train/trainManager.js?v=26"></script>
  <script src="src/characters.js?v=26"></script>
  <script src="src/player.js?v=26"></script>
  <script src="src/main.js?v=26"></script>
</body>
</html>
